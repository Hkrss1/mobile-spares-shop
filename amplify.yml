version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
        - npx prisma generate
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
customHeaders:
  - pattern: '/api/**'
    headers:
      - key: 'Access-Control-Allow-Origin'
        value: '*'
      - key: 'Access-Control-Allow-Methods'
        value: 'GET,POST,PUT,DELETE,PATCH,OPTIONS'
      - key: 'Access-Control-Allow-Headers'
        value: 'Content-Type,Authorization'
      - key: 'Access-Control-Max-Age'
        value: '86400'
